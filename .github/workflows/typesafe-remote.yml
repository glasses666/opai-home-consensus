name: TypeSafe Remote Install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/typesafe-remote.yml'

permissions:
  contents: read
  id-token: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Join tailnet with GitHub OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: iz7xv8p0i0u9iehe5j6jgvz.tail0efbb0.ts.net

      - name: Install TypeSafe skill project-locally for Codex
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET='iz7xv8p0i0u9iehe5j6jgvz.tail0efbb0.ts.net'
          timeout 120s tailscale ssh "root@$TARGET" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP='/opt/opai/current/app'
          test -d "$APP"
          test -f "$APP/package.json"
          cd "$APP"
          export DISABLE_TELEMETRY=1
          npx -y skills add typesafe-ai/skills --skill typesafe-ai -a codex -y
          test -f .agents/skills/typesafe-ai/SKILL.md
          grep -q '^name: typesafe-ai$' .agents/skills/typesafe-ai/SKILL.md
          echo "installed_path=$(readlink -f .agents/skills/typesafe-ai/SKILL.md)"
          echo "installed_name=$(sed -n 's/^name: //p' .agents/skills/typesafe-ai/SKILL.md | head -n1)"
          echo "installed_sha256=$(sha256sum .agents/skills/typesafe-ai/SKILL.md | awk '{print $1}')"
          echo "skill_link=$(ls -ld .agents/skills/typesafe-ai)"
          REMOTE
