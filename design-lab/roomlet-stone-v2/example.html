<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>石间 · 小尺寸网页嵌入示例</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbfaf6;color:#3d4835;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{max-width:1040px;margin:auto;padding:35px 30px;border-bottom:1px solid #e2e5d8;display:flex;justify-content:space-between;align-items:center;font-size:12px}header strong{font-size:21px;font-weight:500;letter-spacing:3px;font-family:"Songti SC",serif}header span{font-size:9px;color:#8f9887;letter-spacing:1px}main{min-height:calc(100svh - 200px);max-width:1040px;margin:auto;display:grid;grid-template-columns:1fr 440px;gap:40px;align-items:center;padding:60px 30px}.copy h1{font-family:"Songti SC",serif;font-size:43px;font-weight:500;line-height:1.5;letter-spacing:2px;margin:0 0 24px}.copy p{font-size:13px;color:#8a937f;line-height:2.1;max-width:295px}.copy a{color:#546946;display:inline-block;margin-top:17px;font-size:12px;text-decoration:none;border-bottom:1px solid #9cae8e;padding-bottom:6px}.ornament{position:relative;max-width:100%;width:400px;height:455px;background:transparent;justify-self:center}canvas{display:block;width:100%;height:100%;outline-offset:-5px}.controls{position:absolute;bottom:0;left:40px;right:40px;display:flex;justify-content:space-between;align-items:center}.controls span{font-size:10px;color:#849277}.controls button{font:inherit;font-size:10px;border:1px solid #d9e1ce;background:transparent;color:#5e7051;border-radius:20px;padding:8px 14px;cursor:pointer}footer{max-width:980px;margin:auto;border-top:1px solid #e0e5d8;padding:23px 0;display:flex;justify-content:space-between;color:#97a18d;font-size:10px;letter-spacing:.5px}@media(max-width:700px){header{padding:25px}.copy h1{font-size:31px;line-height:1.5;margin-bottom:13px}main{display:flex;flex-direction:column;gap:8px;padding:32px 25px 35px;align-items:flex-start}.copy p{font-size:11px;margin-bottom:0}.copy a{font-size:11px;margin-top:15px}.ornament{width:340px;height:395px;align-self:center}.controls{left:20px;right:20px}footer{margin:0 25px;line-height:1.8;font-size:9px;gap:20px}.copy h1 br{display:none}}
</style></head>
<body><header><strong>石间</strong><span>A LITTLE ROOM, IN MOTION</span></header><main><div class="copy"><h1>给日常，<br>留一点转身的空间。</h1><p>石头安静，家具忙碌。<br>把一个会换位的小房间，放进网页的留白。</p><a href="preview.html">打开完整交互预览 ↗</a></div><div class="ornament"><canvas id="room" tabindex="0" aria-label="小尺寸三维摆件：可拖动旋转、缩放"></canvas><div class="controls"><span id="phase">原布局 · 相聚</span><button id="pause">暂停动画</button></div></div></main><footer><span>透明画布 · 本地资源 · 保留独立对象</span><span>示例组件 400 × 455 px</span></footer>
<script src="src/scene-data.js"></script><script src="src/renderer.js"></script><script src="src/viewer.js"></script>
<script>
const viewer=new RoomletViewer(document.getElementById('room'),SCULPT_SCENE);
viewer.onReady=()=>{window.EXAMPLE_READY=true;viewer.onPlaying(viewer.playing);};
viewer.onTime=(time,phase)=>document.getElementById('phase').textContent=phase.label;
viewer.onPlaying=playing=>document.getElementById('pause').textContent=playing?'暂停动画':'继续播放';
document.getElementById('pause').onclick=()=>viewer.toggle();
</script></body></html>
