<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROOMLET 嵌入示例</title><style>body{margin:0;min-height:100vh;display:grid;place-content:center;background:#353d32;color:#f1eee2;font:14px system-ui}main{max-width:360px;padding:24px}h1{font-size:21px;font-weight:500}iframe{width:100%;aspect-ratio:1;border:0;display:block;background:transparent}nav{display:flex;flex-wrap:wrap;gap:8px}button{background:transparent;color:inherit;border:1px solid #6d7567;border-radius:20px;padding:8px 14px;cursor:pointer}p{line-height:1.7;opacity:.7}</style></head><body><main><h1>陪孩子慢慢长大</h1><iframe src="../embed.html" title="可交互的透明房间" loading="lazy"></iframe><nav><button data-action="play">播放</button><button data-action="pause">暂停</button><button data-action="seek" data-time="0">原布局</button><button data-action="seek" data-time="9">调整后</button><button data-action="reset">恢复视角</button></nav><p>透明的 iframe 内容；背景由这个父页面提供。拖动旋转，滚轮缩放。</p></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const message={type:'roomlet',action:b.dataset.action};if(b.dataset.time!==undefined)message.time=Number(b.dataset.time);const target=location.origin==='null'?'*':location.origin;document.querySelector('iframe').contentWindow.postMessage(message,target);});</script></body></html>
